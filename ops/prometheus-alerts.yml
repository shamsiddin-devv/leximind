groups:
  - name: leximind-api
    rules:
      - alert: LexiMindApiElevatedServerErrors
        expr: |
          (sum(rate(leximind_http_request_duration_seconds_count{status="5xx"}[5m]))
           / clamp_min(sum(rate(leximind_http_request_duration_seconds_count[5m])), 0.001)) > 0.05
          and sum(increase(leximind_http_request_duration_seconds_count[5m])) >= 20
        for: 10m
        labels:
          severity: warning
      - alert: LexiMindApiHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(leximind_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
