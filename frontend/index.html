<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <script>
      let savedTheme;
      try { savedTheme = localStorage.getItem('leximind.theme'); } catch {}
      document.documentElement.dataset.theme = savedTheme === 'dark' || savedTheme === 'light'
        ? savedTheme
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>
    <meta name="description" content="LexiMind — inglizcha so‘zlarni mashqlar, o‘yinlar va takrorlash orqali o‘rganing." />
    <title>Home — LexiMind</title>
    <link rel="stylesheet" href="/src/shared/components/LoadingScreen.css" />
  </head>
  <body>
    <div id="root"></div>
    <div id="app-loading" class="loading-screen">
      <div class="loading-screen-status" role="status" aria-label="Yuklanmoqda">
        <img src="/loading.svg" width="800" height="200" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
